# One service per supported PHP version. Nothing here is a daemon; use
# `docker compose run --rm phpXY <command>` (or the Makefile targets) to run things.

x-php: &php
  working_dir: /app
  volumes:
    - .:/app
    - composer-cache:/tmp/composer/cache

services:
  php81:
    <<: *php
    image: just-date-php:8.1
    build:
      context: docker
      args:
        PHP_VERSION: "8.1"

  php82:
    <<: *php
    image: just-date-php:8.2
    build:
      context: docker
      args:
        PHP_VERSION: "8.2"

  php83:
    <<: *php
    image: just-date-php:8.3
    build:
      context: docker
      args:
        PHP_VERSION: "8.3"

  php84:
    <<: *php
    image: just-date-php:8.4
    build:
      context: docker
      args:
        PHP_VERSION: "8.4"

  php85:
    <<: *php
    image: just-date-php:8.5
    build:
      context: docker
      args:
        PHP_VERSION: "8.5"

volumes:
  composer-cache:
